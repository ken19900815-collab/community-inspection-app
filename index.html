<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>社區巡檢系統</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:15px;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

h3{
    margin-top:0;
}

button{
    border:none;
    padding:10px 14px;
    margin:5px 5px 10px 0;
    border-radius:8px;
    color:white;
    font-size:14px;
}

.ok{
    background:#4CAF50;
}

.warn{
    background:#FFC107;
    color:black;
}

.bad{
    background:#F44336;
}

input, textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    margin-top:8px;
    box-sizing:border-box;
    font-size:14px;
}

textarea{
    min-height:80px;
}

.submitBtn{
    width:100%;
    background:#2196F3;
    font-size:18px;
    padding:15px;
}

</style>

</head>

<body>

<h2>📋 社區巡檢系統</h2>

<div class="card">

<label>巡檢人員</label>
<input type="text" id="name" placeholder="請輸入巡檢人員">

<br><br>

<label>巡檢日期</label>
<input type="date" id="date">

</div>

<div id="app"></div>

<div class="card">

<button class="submitBtn" onclick="submitData()">
📤 送出巡檢
</button>

</div>

<script>

const locations = [
"B1庫房",
"B2庫房",
"B3庫房",
"B4庫房",
"A棟一樓安全梯",
"泳池",
"2樓家教室",
"2樓桌球室",
"2樓健身房",
"2樓休息室",
"14樓中繼水塔",
"26樓廚房",
"頂樓水池",
"B棟一樓安全梯",
"B棟頂樓",
"後哨"
];

const app = document.getElementById("app");

locations.forEach((loc, i) => {

    const div = document.createElement("div");

    div.className = "card";

    div.innerHTML = `
    
        <h3>${loc}</h3>

        <button class="ok" onclick="setStatus(${i}, '正常')">
        正常
        </button>

        <button class="warn" onclick="setStatus(${i}, '注意')">
        注意
        </button>

        <button class="bad" onclick="setStatus(${i}, '異常')">
        異常
        </button>

        <input 
            type="text"
            id="status${i}"
            placeholder="目前狀況"
            readonly
        >

        <textarea
            id="note${i}"
            placeholder="異常說明..."
        ></textarea>

    `;

    app.appendChild(div);

});

function setStatus(i, status){

    document.getElementById("status"+i).value = status;

}

function resetForm(){

    document.getElementById("name").value = "";

    document.getElementById("date").value = "";

    locations.forEach((loc, i)=>{

        document.getElementById("status"+i).value = "";

        document.getElementById("note"+i).value = "";

    });

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

function submitData(){

    const name = document.getElementById("name").value;

    const date = document.getElementById("date").value;

    let data = [];

    locations.forEach((loc, i)=>{

        const status = document.getElementById("status"+i).value;

        const note = document.getElementById("note"+i).value;

        if(status){

            data.push({
                location:loc,
                status:status,
                note:note
            });

        }

    });

    if(!name){

        alert("請填寫巡檢人員");

        return;

    }

    if(!date){

        alert("請選擇日期");

        return;

    }

    if(data.length === 0){

        alert("請至少填寫一筆巡檢");

        return;

    }

    google.script.run

    .withSuccessHandler(function(){

        alert("✅ 巡檢資料已送出！");

        resetForm();

    })

    .withFailureHandler(function(error){

        alert("❌ 送出失敗：" + error.message);

    })

    .saveData(name, date, data);

}

</script>
</body>

</html>
